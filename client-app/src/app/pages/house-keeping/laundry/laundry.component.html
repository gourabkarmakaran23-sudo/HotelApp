<div class="hk-container">
  <div class="hk-header">
    <h2>Laundry Master Log</h2>
    <button style="background: #ffc107; color: #212529; padding: 8px 15px; border:none; font-weight:bold;" (click)="openModal()">+ Manage Laundry</button>
  </div>
  <div style="overflow-x: auto;">
    <table class="hk-table">
      <thead>
        <tr>
          <th>SL</th><th>Invoice No.</th><th>Laundry Name</th><th>Item Name</th><th>Operate By</th><th>Task Name</th><th>Cost</th><th>Qty</th><th>Status</th><th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of laundryLogs; let i = index">
          <td>{{i+1}}</td><td>{{log.invoiceNo}}</td><td>{{log.laundryName}}</td><td>{{log.itemName}}</td><td>{{log.operateBy}}</td><td>{{log.taskName}}</td><td>{{log.itemCost}}</td><td>{{log.quantity}}</td><td>{{log.paymentStatus}}</td>
          <td><button (click)="openModal(log)">Edit</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-backdrop-custom" *ngIf="isModalOpen">
  <div class="modal-box-custom" style="width: 700px;">
    <h3>Laundry Invoice Operational Form</h3>
    <form [formGroup]="laundryForm" (ngSubmit)="isModalOpen=false">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group-custom"><label>Invoice No *</label><input formControlName="invoiceNo" class="form-control-custom"></div>
        <div class="form-group-custom"><label>Laundry Name *</label><input formControlName="laundryName" class="form-control-custom"></div>
        <div class="form-group-custom"><label>Item Name *</label><input formControlName="itemName" class="form-control-custom"></div>
        <div class="form-group-custom"><label>Cost *</label><input type="number" formControlName="itemCost" class="form-control-custom"></div>
        <div class="form-group-custom"><label>Quantity *</label><input type="number" formControlName="quantity" class="form-control-custom"></div>
        <div class="form-group-custom"><label>Status</label><select formControlName="paymentStatus" class="form-control-custom"><option value="Pending">Pending</option><option value="Paid">Paid</option></select></div>
      </div>
      <div style="margin-top: 15px;"><button type="submit">Save</button><button type="button" (click)="isModalOpen=false">Close</button></div>
    </form>
  </div>
</div>
