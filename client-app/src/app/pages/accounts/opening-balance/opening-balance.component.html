<div class="account-page-container" style="padding: 20px; background: #f8fafc;">
  <div style="background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0; max-width: 650px;">
    <h2 style="font-size: 18px; font-weight: 600; color: #1e293b; margin-bottom: 20px;">Opening Balance</h2>
    
    <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
      <div style="display: flex; align-items: center;">
        <label style="width: 150px; font-size: 13px; font-weight: 600; color: #475569;">Head of Account<span style="color:red">*</span></label>
        <select style="flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; background:#fff;">
          <option value="">Select Option</option>
          <option value="1">Cash in hand</option>
        </select>
      </div>

      <div style="display: flex; align-items: center;">
        <label style="width: 150px; font-size: 13px; font-weight: 600; color: #475569;">Total Amount<span style="color:red">*</span></label>
        <input type="number" placeholder="Total Amount" style="flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
      </div>

      <div style="display: flex; align-items: flex-start;">
        <label style="width: 150px; font-size: 13px; font-weight: 600; color: #475569; margin-top: 6px;">Remark</label>
        <textarea rows="3" style="flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; resize: none;"></textarea>
      </div>
    </div>

    <div style="text-align: right;">
      <button style="background: #22c55e; color: white; padding: 8px 24px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">Save</button>
    </div>
  </div>
</div>
