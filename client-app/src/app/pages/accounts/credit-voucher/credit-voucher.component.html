<div class="account-page-container" style="padding: 20px; background: #f8fafc;">
  <div style="background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0;">
    <h2 style="font-size: 18px; font-weight: 600; color: #1e293b; margin-bottom: 20px;">Credit Voucher</h2>

    <!-- FIXED CONFIGURATION HEADER PANEL -->
    <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:20px; max-width: 800px; margin-bottom: 25px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <label style="width:140px; font-size:13px; font-weight:600; color:#475569;">Voucher No</label>
        <input type="text" value="CV-1" readonly style="flex:1; padding:6px; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:4px;">
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <label style="width:140px; font-size:13px; font-weight:600; color:#475569;">Debit Account Head</label>
        <select style="flex:1; padding:6px; border:1px solid #cbd5e1; border-radius:4px; background:#fff;">
          <option>Cash in hand</option>
        </select>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <label style="width:140px; font-size:13px; font-weight:600; color:#475569;">Date</label>
        <input type="text" value="2026-04-30" style="flex:1; padding:6px; border:1px solid #cbd5e1; border-radius:4px;">
      </div>
      <div style="display:flex; align-items:flex-start; gap:10px;">
        <label style="width:140px; font-size:13px; font-weight:600; color:#475569; margin-top:5px;">Remark</label>
        <textarea rows="1" style="flex:1; padding:6px; border:1px solid #cbd5e1; border-radius:4px; resize:none;"></textarea>
      </div>
    </div>

    <!-- TRANSACTION DATAGRID REPOSITORIES STREAMS -->
    <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
      <thead>
        <tr style="background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
          <th style="padding: 10px; text-align: left; font-size: 13px; font-weight:600; color:#475569; border: 1px solid #e2e8f0;">Account Name</th>
          <th style="padding: 10px; text-align: left; font-size: 13px; font-weight:600; color:#475569; border: 1px solid #e2e8f0;">Code</th>
          <th style="padding: 10px; text-align: left; font-size: 13px; font-weight:600; color:#475569; border: 1px solid #e2e8f0;">Total Amount</th>
          <th style="padding: 10px; text-align: center; font-size: 13px; font-weight:600; color:#475569; border: 1px solid #e2e8f0; width: 80px;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="padding: 8px; border: 1px solid #e2e8f0;">
            <select style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; background:#fff;">
              <option>Bank Interest</option>
            </select>
          </td>
          <td style="padding: 8px; border: 1px solid #e2e8f0;"><input type="text" style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px;"></td>
          <td style="padding: 8px; border: 1px solid #e2e8f0;"><input type="number" style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: right;"></td>
          <td style="padding: 8px; border: 1px solid #e2e8f0; text-align: center;">
            <button style="background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer;">🗑</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <button style="background: #06b6d4; color: white; padding: 8px 16px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">Add More</button>
      <button style="background: #22c55e; color: white; padding: 8px 24px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">Save</button>
    </div>
  </div>
</div>
