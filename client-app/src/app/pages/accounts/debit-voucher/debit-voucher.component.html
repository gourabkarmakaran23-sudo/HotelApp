<div class="account-page-container">
  <div class="card-box">
    <div class="page-header">
      <h2>Debit Voucher</h2>
    </div>

    <!-- Top Grid Forms Layer -->
    <div class="form-grid" style="max-width: 800px;">
      <div class="form-group-flex">
        <label>Voucher No</label>
        <input type="text" [value]="voucherNo" readonly>
      </div>
      <div class="form-group-flex">
        <label>Credit Account Head</label>
        <select [(ngModel)]="creditAccountHead">
          <option>Cash in hand</option>
        </select>
      </div>
      <div class="form-group-flex">
        <label>Date</label>
        <input type="date" [(ngModel)]="voucherDate">
      </div>
      <div class="form-group-flex">
        <label>Remark</label>
        <textarea [(ngModel)]="remark" rows="1"></textarea>
      </div>
    </div>

    <!-- Data Elements Grid Matrix -->
    <table class="data-table">
      <thead>
        <tr>
          <th>Account Name</th>
          <th>Code</th>
          <th>Total Amount</th>
          <th style="width: 80px; text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows; let i = index">
          <td>
            <select [(ngModel)]="row.accountName">
              <option value="">Select Head</option>
              <option value="stationery">Stationery Expense</option>
            </select>
          </td>
          <td><input type="text" [(ngModel)]="row.code"></td>
          <td><input type="number" [(ngModel)]="row.amount" style="text-align: right;"></td>
          <td style="text-align: center;">
            <button class="btn btn-danger" (click)="removeRow(i)">🗑</button>
          </td>
        </tr>
        <tr style="background: #f8fafc; font-weight: 600;">
          <td colspan="2" style="text-align: right;">Total:</td>
          <td style="text-align: right; background: #f1f5f9;">₹{{ calculateTotal().toFixed(2) }}</td>
          <td></td>
        </tr>
      </tbody>
    </table>

    <div style="display: flex; justify-content: space-between;">
      <button class="btn btn-info" (click)="addNewRow()">Add More</button>
      <button class="btn btn-success" (click)="saveVoucher()">Save Voucher</button>
    </div>
  </div>
</div>
