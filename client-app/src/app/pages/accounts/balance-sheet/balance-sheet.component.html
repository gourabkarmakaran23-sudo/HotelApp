<div class="account-page-container" style="padding: 20px; background: #f8fafc; font-family: sans-serif;">
  
  <!-- Search Params Panel mapping Image 6 Top segment -->
  <div style="background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; max-width: 500px;">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
      <label style="width: 100px; font-size: 13px; font-weight: 600; color: #475569;">From Date</label>
      <input type="date" [(ngModel)]="fromDate" style="flex: 1; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px;">
    </div>
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
      <label style="width: 100px; font-size: 13px; font-weight: 600; color: #475569;">To Date</label>
      <input type="date" [(ngModel)]="toDate" style="flex: 1; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px;">
    </div>
    <div style="display: flex; justify-content: flex-end;">
      <button (click)="onFind()" style="background: #22c55e; color: white; padding: 6px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Find</button>
    </div>
  </div>

  <!-- Bottom Main Statement Rendering Section Structure mapping Image 6 -->
  <div style="background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px;">
      <h3 style="font-size: 16px; font-weight: 600; color: #1e293b; margin: 0;">Balance Sheet Report</h3>
      <div style="display: flex; gap: 10px;">
        <button (click)="onAdd()" style="background: #2563eb; color: white; padding: 8px 16px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">+ Add Asset/Liability</button>
        <button (click)="onPrint()" style="background: #06b6d4; color: white; padding: 8px 16px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">Print</button>
      </div>
    </div>

    <div style="text-align: center; margin-bottom: 20px;">
      <h2 style="margin: 0; font-size: 22px; font-weight: 400; color: #000;">Balance Sheet Statement</h2>
      <p style="margin: 5px 0; font-size: 12px; color: #475569; font-weight: 600;">On 2026-04-27 00:00:00 To 2026-04-30</p>
      <div style="text-align: right; font-size: 12px; color: #475569; font-weight: 600; margin-top:-15px;">Date: 30-Apr-2026</div>
    </div>

    <!-- Structured Balance Sheet Layout -->
    <table style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr style="border-bottom: 1px solid #cbd5e1;">
          <th style="padding: 8px; text-align: left; font-size: 13px; font-weight: 600; color: #475569;">Particulars</th>
          <th style="padding: 8px; text-align: right; font-size: 13px; font-weight: 600; color: #475569; width: 220px;">Total Amount</th>
          <th style="padding: 8px; text-align: center; font-size: 13px; font-weight: 600; color: #475569; width: 120px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Current Assets Segment row mappings -->
        <tr style="font-weight: bold; font-size: 13px; background: #fafafa;">
          <td colspan="3" style="padding: 8px; color:#000;">Current Asset</td>
        </tr>
        <tr *ngFor="let asset of currentAssets">
          <td style="padding: 6px 8px; font-size: 13px; padding-left: 20px;" [style.font-weight]="asset.isHeader ? '600' : '400'" [style.color]="asset.isHeader ? '#475569':'#000'">
            {{asset.name}}
          </td>
          <td style="padding: 6px 8px; text-align: right; font-size: 13px;">
            <span *ngIf="asset.amount !== null">{{asset.amount | number:'1.2-2'}}</span>
          </td>
          <td style="padding: 6px 8px; text-align: center;">
            <button (click)="onEdit(asset)" style="color:#d97706; background:none; border:none; cursor:pointer; font-size:11px;">Edit</button> | 
            <button (click)="onDelete(asset)" style="color:#dc2626; background:none; border:none; cursor:pointer; font-size:11px;">Delete</button>
          </td>
        </tr>
        <tr style="font-weight: 600; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #cbd5e1;">
          <td style="padding: 8px; text-align: right; font-size: 13px; padding-right: 50px;">Total Current Asset</td>
          <td style="padding: 8px; text-align: right; font-size: 13px;">{{totalCurrentAssets | number:'1.2-2'}}</td>
          <td></td>
        </tr>

        <!-- Non Current Assets Segment row mappings -->
        <tr style="font-weight: bold; font-size: 13px; background: #fafafa;">
          <td colspan="3" style="padding: 8px; color:#000; padding-top:15px;">Non Current Assets</td>
        </tr>
        <tr *ngFor="let asset of nonCurrentAssets">
          <td style="padding: 6px 8px; font-size: 13px; padding-left: 20px; color:#000;">{{asset.name}}</td>
          <td style="padding: 6px 8px; text-align: right; font-size: 13px; color:#94a3b8;">-</td>
          <td style="padding: 6px 8px; text-align: center;">
            <button (click)="onEdit(asset)" style="color:#d97706; background:none; border:none; cursor:pointer; font-size:11px;">Edit</button> | 
            <button (click)="onDelete(asset)" style="color:#dc2626; background:none; border:none; cursor:pointer; font-size:11px;">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
