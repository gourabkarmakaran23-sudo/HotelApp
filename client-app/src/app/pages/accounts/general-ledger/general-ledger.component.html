<div class="account-page-container" style="padding: 20px; background: #f8fafc; font-family: sans-serif;">
  <div style="background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 style="font-size: 18px; font-weight: 600; color: #1e293b; margin: 0;">General Ledger</h2>
      <button (click)="onAdd()" style="background: #2563eb; color: white; padding: 8px 16px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">+ Add New Ledger</button>
    </div>

    <!-- Search parameters from Image 2 -->
    <div style="display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 500px; margin-bottom: 25px; padding: 20px; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <label style="width: 140px; font-size: 13px; font-weight: 600; color: #475569;">GL Head</label>
        <select [(ngModel)]="glHead" style="flex: 1; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff;">
          <option value="">Select Option</option>
        </select>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <label style="width: 140px; font-size: 13px; font-weight: 600; color: #475569;">Transaction Head</label>
        <select [(ngModel)]="transactionHead" style="flex: 1; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff;">
          <option value="">Select Option</option>
        </select>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <label style="width: 140px; font-size: 13px; font-weight: 600; color: #475569;">From Date</label>
        <input type="date" [(ngModel)]="fromDate" style="flex: 1; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px;">
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <label style="width: 140px; font-size: 13px; font-weight: 600; color: #475569;">To Date</label>
        <input type="date" [(ngModel)]="toDate" style="flex: 1; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px;">
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding-left: 140px;">
        <input type="checkbox" id="withDetails" [(ngModel)]="withDetails">
        <label for="withDetails" style="font-size: 13px; color: #475569; user-select: none;">With Details</label>
      </div>
      <div style="display: flex; justify-content: flex-end;">
        <button (click)="onFind()" style="background: #22c55e; color: white; padding: 6px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Find</button>
      </div>
    </div>

    <!-- Main List Table View -->
    <table style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0;">
          <th style="padding: 10px; border: 1px solid #e2e8f0; text-align: left; font-size: 13px; font-weight:600; color:#475569;">Account Code</th>
          <th style="padding: 10px; border: 1px solid #e2e8f0; text-align: left; font-size: 13px; font-weight:600; color:#475569;">Account Name</th>
          <th style="padding: 10px; border: 1px solid #e2e8f0; text-align: left; font-size: 13px; font-weight:600; color:#475569;">Type</th>
          <th style="padding: 10px; border: 1px solid #e2e8f0; text-align: right; font-size: 13px; font-weight:600; color:#475569;">Balance</th>
          <th style="padding: 10px; border: 1px solid #e2e8f0; text-align: center; font-size: 13px; font-weight:600; color:#475569; width: 120px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of ledgers" style="border-bottom: 1px solid #e2e8f0;">
          <td style="padding: 10px; border: 1px solid #e2e8f0; font-size: 13px;">{{item.code}}</td>
          <td style="padding: 10px; border: 1px solid #e2e8f0; font-size: 13px;">{{item.name}}</td>
          <td style="padding: 10px; border: 1px solid #e2e8f0; font-size: 13px;">{{item.type}}</td>
          <td style="padding: 10px; border: 1px solid #e2e8f0; font-size: 13px; text-align: right;">{{item.balance | number:'1.2-2'}}</td>
          <td style="padding: 10px; border: 1px solid #e2e8f0; text-align: center;">
            <button (click)="onEdit(item)" style="background: #f59e0b; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; margin-right: 5px; font-size: 12px;">Edit</button>
            <button (click)="onDelete(item.id)" style="background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
