<div class="account-page-container" style="padding: 20px; background: #f8fafc;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="font-size:18px; font-weight:600; color:#1e293b;">Chart of Account</h2>
    <button (click)="isFormOpen = !isFormOpen" style="background:#2563eb; color:white; padding:8px 16px; border:none; border-radius:4px; font-weight:600; cursor:pointer;">
      {{ isFormOpen ? 'View List' : 'Add New Account Head' }}
    </button>
  </div>

  <!-- INPUT FIELDS WRAPPER -->
  <div *ngIf="isFormOpen" style="background:#fff; padding:20px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:20px;">
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-bottom:15px;">
      <div>
        <label style="display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px;">Account Head *</label>
        <input type="text" [(ngModel)]="accountHead.name" style="width:100%; padding:6px 10px; border:1px solid #cbd5e1; border-radius:4px;">
      </div>
      <div>
        <label style="display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px;">Account Code *</label>
        <input type="text" [(ngModel)]="accountHead.code" style="width:100%; padding:6px 10px; border:1px solid #cbd5e1; border-radius:4px;">
      </div>
    </div>
    <button style="background:#22c55e; color:white; padding:7px 20px; border:none; border-radius:4px; font-weight:600; cursor:pointer;">Save Head</button>
  </div>

  <!-- UTILITY SPREADSHEET LEDGER CONTAINER -->
  <div *ngIf="!isFormOpen" style="background:#fff; padding:15px; border-radius:8px; border:1px solid #e2e8f0;">
    <ag-grid-angular style="width:100%; height:350px;" class="ag-theme-alpine" [rowData]="rowData" [columnDefs]="columnDefs" [pagination]="true"></ag-grid-angular>
  </div>
</div>
